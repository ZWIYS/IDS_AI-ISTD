version: '3.8'

services:
  pipeline:
    build: .
    container_name: ids_pipeline
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./alerts:/app/alerts
      - ./scripts:/app/scripts
    command: ["Rscript", "run_pipeline.R"]

  dashboard:
    build: .
    container_name: ids_dashboard
    ports:
      - "4321:4321"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./alerts:/app/alerts
    command: ["Rscript", "-e", "idsAiIstd::run_dashboard(port=4321, host='0.0.0.0')"]
    restart: unless-stopped
