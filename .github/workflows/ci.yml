# CI: кэш R-библиотек через setup-r-dependencies (pak + GHA cache).
# В CI ставятся только Imports из DESCRIPTION (без Shiny) — быстрее сборки.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
          use-public-rspm: true

      # Кэш по хэшу DESCRIPTION; бинарники с Posit PM для Ubuntu 22.04
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: runtime
          cache-version: 1

